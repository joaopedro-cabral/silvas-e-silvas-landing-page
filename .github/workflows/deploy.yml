name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Pegando o código
        uses: actions/checkout@v3

      - name: 🟢 Configurando Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Instalando dependências
        run: npm ci

      - name: 🔎 Verificando TypeScript
        run: npx tsc --noEmit

      - name: 🏗️ Fazendo o Build (TypeScript -> JS)
        run: npm run build

      - name: 🚀 Subindo para a Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          # Não executar a limpeza completa do diretório de destino.
          dangerous-clean-slate: false
